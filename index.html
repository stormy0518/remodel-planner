<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Remodel Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2333;--surface3:#252a3d;
  --border:#2d3350;--border2:#3a4060;
  --text:#e8eaf0;--text2:#9aa0b8;--text3:#5c6380;
  --accent:#6c8fff;--accent2:#4f6fe8;
  --green:#4ecf8a;--amber:#f5c542;--red:#ff6b6b;--purple:#b07fff;
  --phase-colors:#6c8fff,#4ecf8a,#f5c542,#ff8c5a,#b07fff,#ff6b9d,#5dd6f0,#a8d840;
  --row-h:36px;--sub-h:30px;--label-w:260px;--meta-w:340px;
  --font-display:'DM Serif Display',serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'DM Mono',monospace;
}
html{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14px;height:100%}
body{min-height:100vh;display:flex;flex-direction:column}

/* ── TOP NAV ── */
.topbar{display:flex;align-items:center;gap:16px;padding:0 24px;height:56px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.logo{font-family:var(--font-display);font-size:20px;color:var(--text);letter-spacing:-.3px}
.logo span{color:var(--accent)}
.nav-tabs{display:flex;gap:4px;margin-left:auto}
.nav-tab{padding:6px 16px;border-radius:6px;border:none;background:transparent;color:var(--text2);font-family:var(--font-body);font-size:13px;cursor:pointer;transition:all .15s}
.nav-tab:hover{background:var(--surface3);color:var(--text)}
.nav-tab.active{background:var(--accent);color:#fff}
.topbar-actions{display:flex;gap:8px;margin-left:8px}
.btn{padding:7px 14px;border-radius:6px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-family:var(--font-body);font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--surface3);border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-danger{border-color:#ff6b6b44;color:var(--red)}
.btn-danger:hover{background:#ff6b6b22}
.btn-sm{padding:4px 10px;font-size:11px}

/* ── VIEWS ── */
.view{display:none;flex:1;overflow:hidden}
.view.active{display:flex;flex-direction:column}

/* ── GANTT VIEW ── */
#gantt-view{flex-direction:column}
.gantt-toolbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.gantt-toolbar label{font-size:12px;color:var(--text2)}
.gantt-toolbar input[type=date]{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:4px 8px;font-family:var(--font-mono);font-size:12px}
.project-stats{display:flex;gap:20px;margin-left:auto}
.stat{text-align:right}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.stat-val{font-size:15px;font-weight:600;color:var(--accent);font-family:var(--font-mono)}

.gantt-wrap{overflow:auto;flex:1}
.gantt-table{min-width:100%;border-collapse:collapse}

/* Gantt header */
.gantt-head{position:sticky;top:0;z-index:50}
.gantt-head th{background:var(--surface2);border-bottom:1px solid var(--border2);padding:0;white-space:nowrap}
.th-label{width:var(--label-w);min-width:var(--label-w);padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;border-right:1px solid var(--border)}
.th-meta{padding:6px 8px;text-align:center;font-size:11px;font-weight:500;color:var(--text2)}
.th-meta.owner{width:90px}
.th-meta.date{width:96px}
.th-meta.days{width:52px}
.th-meta.pct{width:60px}
.th-meta.cost{width:88px;border-right:1px solid var(--border)}
.th-week{width:28px;min-width:28px;font-size:10px;font-weight:500;color:var(--text3);text-align:center;vertical-align:bottom;padding-bottom:4px;border-right:1px solid var(--border)}
.th-week.month-start{color:var(--text2);font-weight:600;font-size:10px}
.month-label-row th{background:var(--surface);border-bottom:1px solid var(--border);font-size:10px;color:var(--text3);text-align:center;padding:3px 0}
.month-label-row .ml-cell{text-align:left;padding-left:4px;color:var(--accent);font-weight:600}

/* Gantt body rows */
.phase-row td{background:var(--surface2);border-bottom:1px solid var(--border);cursor:pointer}
.phase-row:hover td{background:var(--surface3)}
.phase-label{padding:0 10px 0 12px;display:flex;align-items:center;gap:8px;height:var(--row-h)}
.phase-chevron{font-size:10px;transition:transform .2s;color:var(--text3);flex-shrink:0}
.phase-chevron.open{transform:rotate(90deg)}
.phase-name{font-weight:600;font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phase-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.sub-row td{background:var(--surface);border-bottom:1px solid var(--border);transition:background .1s}
.sub-row:hover td{background:var(--surface2)}
.sub-row.hidden{display:none}
.sub-label{padding:0 10px 0 32px;display:flex;align-items:center;gap:6px;height:var(--sub-h)}
.sub-name{font-size:12px;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.add-sub-row td{background:var(--surface);border-bottom:1px solid var(--border)}
.add-sub-row.hidden{display:none}
.add-btn-cell{padding:4px 10px 4px 32px}
.add-inline-btn{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);cursor:pointer;padding:3px 8px;border-radius:4px;border:1px dashed var(--border2);background:transparent;transition:all .15s;font-family:var(--font-body)}
.add-inline-btn:hover{color:var(--accent);border-color:var(--accent);background:rgba(108,143,255,.08)}

.spacer-row td{height:6px;background:var(--bg);border:none}

/* Meta cells */
.meta-cell{padding:4px 6px;text-align:center;font-size:12px;color:var(--text2);vertical-align:middle;white-space:nowrap}
.meta-cell.editable{cursor:pointer;border-radius:4px;transition:background .1s}
.meta-cell.editable:hover{background:var(--surface3);color:var(--text)}
.meta-cell input,.meta-cell select{width:100%;background:var(--surface3);border:1px solid var(--accent);color:var(--text);border-radius:4px;padding:2px 4px;font-family:var(--font-mono);font-size:11px;outline:none;text-align:center}
.pct-bar{height:4px;border-radius:2px;background:var(--border2);margin-top:3px;overflow:hidden}
.pct-fill{height:100%;border-radius:2px;transition:width .3s}
.cost-cell{text-align:right;padding-right:10px;font-family:var(--font-mono);font-size:11px;color:var(--text2)}
.cost-border{border-right:1px solid var(--border)}

/* Gantt bars */
.bar-cell{padding:0;border-right:1px solid rgba(255,255,255,.03);vertical-align:middle;height:var(--sub-h)}
.phase-row .bar-cell{height:var(--row-h)}
.bar-inner{height:100%;display:flex;align-items:center;justify-content:center}
.bar-block{height:60%;border-radius:2px;width:100%}
.phase-row .bar-block{height:70%}

/* ── COST VIEW ── */
#cost-view{flex-direction:column}
.cost-wrap{overflow:auto;flex:1;padding:24px}
.cost-header-row{display:grid;grid-template-columns:1fr 1fr 120px 120px 120px 140px;gap:0;background:var(--surface2);border:1px solid var(--border);border-radius:8px 8px 0 0;padding:10px 16px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;z-index:10}
.cost-phase-block{background:var(--surface);border:1px solid var(--border);border-top:none;margin-bottom:0}
.cost-phase-block:last-child{border-radius:0 0 8px 8px}
.cost-phase-hdr{display:grid;grid-template-columns:1fr 1fr 120px 120px 120px 140px;gap:0;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.cost-phase-hdr:hover{background:var(--surface2)}
.cost-phase-name{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.cost-subtask-block{border-bottom:1px solid var(--border)}
.cost-subtask-block:last-child{border-bottom:none}
.cost-subtask-hdr{display:grid;grid-template-columns:1fr 1fr 120px 120px 120px 140px;padding:8px 16px 8px 32px;background:var(--surface2);border-bottom:1px solid var(--border);font-weight:500;font-size:12px;border-left:3px solid transparent}
.cost-line{display:grid;grid-template-columns:1fr 1fr 120px 120px 120px 140px;padding:6px 16px 6px 48px;border-bottom:1px solid rgba(45,51,80,.5);font-size:12px;transition:background .1s}
.cost-line:hover{background:var(--surface2)}
.cost-line-desc{color:var(--text);font-style:italic}
.cost-amt{font-family:var(--font-mono);font-size:12px;color:var(--text);text-align:right}
.cost-running{font-family:var(--font-mono);font-size:12px;color:var(--accent);text-align:right;font-weight:500}
.cost-total-row{display:grid;grid-template-columns:1fr 1fr 120px 120px 120px 140px;padding:12px 16px;background:var(--surface2);border-top:1px solid var(--border2);font-weight:600;position:sticky;bottom:0}
.cost-add-row{padding:6px 16px 6px 48px;cursor:pointer;color:var(--text3);font-size:11px;display:flex;align-items:center;gap:6px;transition:all .15s}
.cost-add-row:hover{color:var(--accent);background:rgba(108,143,255,.06)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:28px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal h2{font-family:var(--font-display);font-size:22px;margin-bottom:20px;color:var(--text)}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.form-row input,.form-row select,.form-row textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:6px;padding:8px 10px;font-family:var(--font-body);font-size:13px;outline:none;transition:border-color .15s}
.form-row input:focus,.form-row select:focus{border-color:var(--accent)}
.form-row select option{background:var(--surface2)}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.cost-items-list{border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:8px}
.cost-item-row{display:grid;grid-template-columns:1fr 120px 32px;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);align-items:center}
.cost-item-row:last-child{border-bottom:none}
.cost-item-row input{background:transparent;border:none;border-bottom:1px solid var(--border2);border-radius:0;padding:2px 4px;font-size:12px}
.cost-item-row input:focus{border-color:var(--accent)}
.del-cost-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;line-height:1;padding:2px;border-radius:3px}
.del-cost-btn:hover{color:var(--red);background:rgba(255,107,107,.1)}
.add-cost-item-btn{font-size:11px;color:var(--text3);cursor:pointer;padding:6px 10px;display:flex;align-items:center;gap:5px;transition:color .15s;background:none;border:none;font-family:var(--font-body)}
.add-cost-item-btn:hover{color:var(--accent)}

/* Progress donut */
.phase-pct{font-size:10px;color:var(--text3);font-family:var(--font-mono);margin-left:auto}

/* Totals banner */
.totals-banner{display:flex;gap:24px;padding:12px 20px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.total-item{display:flex;flex-direction:column;gap:2px}
.total-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.total-val{font-size:16px;font-weight:600;font-family:var(--font-mono)}
.total-val.green{color:var(--green)}
.total-val.accent{color:var(--accent)}
.total-val.amber{color:var(--amber)}


/* Toast */
.toast{position:fixed;bottom:24px;right:24px;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:#1a2e1a;border:1px solid var(--green);color:var(--green)}
.toast.err{background:#2e1a1a;border:1px solid var(--red);color:var(--red)}
.toast.info{background:var(--surface2);border:1px solid var(--border2);color:var(--text2)}
.saving-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);position:fixed;bottom:28px;left:24px;opacity:0;transition:opacity .3s}
.saving-dot.show{opacity:1}
/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* Editable text inline */
.inline-edit{cursor:pointer;border-bottom:1px dashed transparent;transition:border-color .15s}
.inline-edit:hover{border-bottom-color:var(--accent)}

/* Empty state */
.empty-ph{color:var(--text3);font-size:12px;font-style:italic}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Remodel<span>.</span>plan</div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchView('gantt')">Gantt Chart</button>
    <button class="nav-tab" onclick="switchView('cost')">Cost Summary</button>
  </div>
  <div class="topbar-actions">
    <button class="btn" onclick="openAddPhase()">+ Phase</button>
    <button class="btn btn-primary" onclick="exportData()">Export JSON</button>
    <label class="btn" style="cursor:pointer">Import <input type="file" accept=".json" onchange="importData(event)" style="display:none"></label>
  </div>
</div>

<!-- GANTT VIEW -->
<div id="gantt-view" class="view active">
  <div class="gantt-toolbar">
    <label>Project start</label>
    <input type="date" id="project-start" onchange="onProjectStartChange()">
    <label style="margin-left:8px">Project end</label>
    <input type="date" id="project-end" onchange="onProjectEndChange()">
    <div class="project-stats">
      <div class="stat"><div class="stat-label">Total Cost</div><div class="stat-val" id="stat-cost">$0</div></div>
      <div class="stat"><div class="stat-label">Phases</div><div class="stat-val" id="stat-phases">0</div></div>
      <div class="stat"><div class="stat-label">Tasks</div><div class="stat-val" id="stat-tasks">0</div></div>
    </div>
  </div>
  <div class="gantt-wrap" id="gantt-wrap">
    <table class="gantt-table" id="gantt-table">
      <thead class="gantt-head" id="gantt-head"></thead>
      <tbody id="gantt-body"></tbody>
    </table>
  </div>
  <div class="totals-banner" id="totals-banner"></div>
</div>

<!-- COST VIEW -->
<div id="cost-view" class="view">
  <div class="cost-wrap" id="cost-wrap"></div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal">
    <h2 id="modal-title">Add Phase</h2>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modal-save-btn" onclick="saveModal()">Save</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// DATA
// ══════════════════════════════════════════
const PHASE_COLORS = ['#6c8fff','#4ecf8a','#f5c542','#ff8c5a','#b07fff','#ff6b9d','#5dd6f0','#a8d840','#ff9f43','#54a0ff'];

let state = {
  projectStart: '2025-07-10',

};

      { id: uid(), label: 'Remove drywall',        owner: 'Crew A',   startDate: '2025-08-07', durationDays: 7,  pct: 0, costs: [{id:uid(),desc:'Labor',amt:3500}] },

    ]},
    { id: uid(), label: 'MEP', color: PHASE_COLORS[3], open: false, subtasks: [

    { id: uid(), label: 'Drywall & Finishes', color: PHASE_COLORS[4], open: false, subtasks: [

let _toastTimer = null;
function showToast(msg, type='ok'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>t.classList.remove('show'), type==='info'?1200:2500);
}
function uid(){ return '_'+Math.random().toString(36).slice(2,9); }
function parseDate(s){ return new Date(s+'T00:00:00'); }
function fmtDate(d){ return d.toISOString().slice(0,10); }
function fmtDateShort(s){ if(!s)return''; const d=parseDate(s); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function fmtMoney(n){ return '$'+Number(n||0).toLocaleString(); }
function addDays(s,n){ const d=parseDate(s); d.setDate(d.getDate()+n); return fmtDate(d); }
function daysBetween(a,b){ return Math.round((parseDate(b)-parseDate(a))/(86400000)); }

function subtaskTotal(sub){ return sub.costs.reduce((s,c)=>s+(+c.amt||0),0); }
function phaseTotal(ph){ return ph.subtasks.reduce((s,sub)=>s+subtaskTotal(sub),0); }
function grandTotal(){ return state.phases.reduce((s,ph)=>s+phaseTotal(ph),0); }
function avgPct(ph){ if(!ph.subtasks.length)return 0; return ph.subtasks.reduce((s,t)=>s+(+t.pct||0),0)/ph.subtasks.length; }

// INIT
// ══════════════════════════════════════════
async function init(){
  showToast('Loading project data…', 'info');
  try {
    const res = await fetch('/data');
    if(res.ok){
      const json = await res.json();
      if(json && json.phases && json.phases.length){
        state = json;
      } else {
        state.phases = defaultPhases();
        await save();
      }
    } else {
      state.phases = defaultPhases();
    }
  } catch(e){
    console.warn('Could not reach server, using defaults.', e);
    state.phases = defaultPhases();
  }
  document.getElementById('project-start').value = state.projectStart;
  document.getElementById('project-end').value = state.projectEnd;
  renderAll();
  showToast('Project loaded', 'ok');
}

let _saveTimer = null;
function save(){
  // Optimistic local backup
  try{ localStorage.setItem('remodel-planner-v2', JSON.stringify(state)); }catch(e){}
  // Debounced server save
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async ()=>{
    try{
      const res = await fetch('/data', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(state)
      });
      if(res.ok){ showToast('Saved', 'ok'); }
      else { showToast('Save failed — check connection', 'err'); }
    } catch(e){ showToast('Save failed — check connection', 'err'); }
  }, 600);
}

function renderAll(){
  renderGantt();
  renderCost();
  renderStats();
}

// ══════════════════════════════════════════
// GANTT RENDER
// ══════════════════════════════════════════
function getWeeks(){
  const start = parseDate(state.projectStart);
  const end   = parseDate(state.projectEnd);
  const weeks = [];
  let cur = new Date(start);
  while(cur <= end){
    weeks.push(new Date(cur));
    cur.setDate(cur.getDate()+7);
  }
  return weeks;
}

function renderGantt(){
  const weeks = getWeeks();
  const projectStart = parseDate(state.projectStart);

  // Build header
  const head = document.getElementById('gantt-head');
  let monthRow = '<tr class="month-label-row"><th colspan="6" style="width:var(--label-w)"></th>';
  let weekRow  = '<tr><th class="th-label">Task</th><th class="th-meta owner">Owner</th><th class="th-meta date">Start Date</th><th class="th-meta days">Days</th><th class="th-meta pct">% Done</th><th class="th-meta cost cost-border">Cost</th>';

  let lastMonth = -1;
  let monthSpan = 0, monthStart = 0;
  const monthCells = [];
  weeks.forEach((wdate,i)=>{
    const m = wdate.getMonth();
    if(m !== lastMonth){
      if(lastMonth !== -1) monthCells.push({month:lastMonth, year:wdate.getFullYear(), span:monthSpan, startI:monthStart});
      lastMonth = m; monthSpan = 1; monthStart = i;
    } else { monthSpan++; }
    const isMS = (i===0 || weeks[i-1].getMonth()!==m);
    weekRow += `<th class="th-week${isMS?' month-start':''}">${isMS?wdate.getDate():''}</th>`;
  });
  if(lastMonth!==-1) monthCells.push({month:lastMonth,span:monthSpan});
  monthCells.forEach(mc=>{
    const name = new Date(2025, mc.month, 1).toLocaleDateString('en-US',{month:'short',year:'2-digit'});
    monthRow += `<th colspan="${mc.span}" class="ml-cell">${name}</th>`;
  });
  monthRow += '</tr>';
  weekRow  += '</tr>';
  head.innerHTML = monthRow + weekRow;

  // Build body
  const body = document.getElementById('gantt-body');
  let html = '';

  state.phases.forEach((ph,pi)=>{
    const phPct = Math.round(avgPct(ph));
    // Phase row
    html += `<tr class="phase-row" onclick="togglePhase('${ph.id}')">
      <td style="border-left:3px solid ${ph.color}">
        <div class="phase-label">
          <span class="phase-dot" style="background:${ph.color}"></span>
          <span class="phase-name" style="color:${ph.color}">${esc(ph.label)}</span>
          <span class="phase-pct">${phPct}%</span>
          <span class="phase-chevron${ph.open?' open':''}">▶</span>
        </div>
      </td>
      <td class="meta-cell"></td>
      <td class="meta-cell"></td>
      <td class="meta-cell"></td>
      <td class="meta-cell">
        <div>${phPct}%</div>
        <div class="pct-bar"><div class="pct-fill" style="width:${phPct}%;background:${ph.color}"></div></div>
      </td>
      <td class="meta-cell cost-cell cost-border">${fmtMoney(phaseTotal(ph))}</td>`;

    // Phase bar cells — span from earliest subtask start to latest subtask end
    const phStarts = ph.subtasks.map(s=>parseDate(s.startDate).getTime()).filter(Boolean);
    const phEnds   = ph.subtasks.map(s=>parseDate(s.startDate).getTime()+s.durationDays*86400000).filter(Boolean);
    const phTStart = phStarts.length ? Math.min(...phStarts) : null;
    const phTEnd   = phEnds.length   ? Math.max(...phEnds)   : null;
    weeks.forEach(wdate=>{
      if(!phTStart){ html += `<td class="bar-cell"></td>`; return; }
      const wStart = wdate.getTime();
      const wEnd   = wStart + 7*86400000;
      const overlapStart = Math.max(wStart, phTStart);
      const overlapEnd   = Math.min(wEnd,   phTEnd);
      const frac = Math.max(0, (overlapEnd - overlapStart) / (7*86400000));
      if(frac > 0){
        html += `<td class="bar-cell"><div class="bar-inner" style="justify-content:flex-start;padding:0 1px"><div style="width:${Math.round(frac*100)}%;height:70%;background:${ph.color};opacity:.25;border-radius:2px;flex-shrink:0"></div></div></td>`;
      } else {
        html += `<td class="bar-cell"><div class="bar-inner"></div></td>`;
      }
    });
    html += `</tr>`;

    // Edit/delete phase actions row (hidden, shown on hover via JS - simpler: just in modal)
    // Subtask rows
    ph.subtasks.forEach((sub,si)=>{
      const subCost = subtaskTotal(sub);
      const endDate = addDays(sub.startDate, sub.durationDays);
      html += `<tr class="sub-row${ph.open?'':' hidden'}" data-phase="${ph.id}" data-sub="${sub.id}">
        <td style="border-left:3px solid ${ph.color}44">
          <div class="sub-label">
            <span class="sub-dot" style="width:5px;height:5px;border-radius:50%;background:${ph.color};opacity:.6;flex-shrink:0"></span>
            <span class="sub-name inline-edit" onclick="event.stopPropagation();openEditSub('${ph.id}','${sub.id}')">${esc(sub.label)}</span>
          </div>
        </td>
        <td class="meta-cell editable" onclick="openEditSub('${ph.id}','${sub.id}')">${esc(sub.owner||'—')}</td>
        <td class="meta-cell editable" onclick="openEditSub('${ph.id}','${sub.id}')">${fmtDateShort(sub.startDate)}</td>
        <td class="meta-cell editable" onclick="openEditSub('${ph.id}','${sub.id}')">${sub.durationDays}d</td>
        <td class="meta-cell">
          <div>${sub.pct}%</div>
          <div class="pct-bar"><div class="pct-fill" style="width:${sub.pct}%;background:${ph.color}"></div></div>
        </td>
        <td class="meta-cell cost-cell cost-border">${subCost?fmtMoney(subCost):'—'}</td>`;

      // Bar cells — day-precision: calculate overlap fraction within each 7-day column
      weeks.forEach(wdate=>{
        const wStart = wdate.getTime();
        const wEnd   = wStart + 7*86400000;
        const tStart = parseDate(sub.startDate).getTime();
        const tEnd   = tStart + sub.durationDays*86400000;
        const overlapStart = Math.max(wStart, tStart);
        const overlapEnd   = Math.min(wEnd,   tEnd);
        const frac = Math.max(0, (overlapEnd - overlapStart) / (7*86400000));
        if(frac > 0){
          const pctDone = sub.pct/100;
          const doneW   = Math.round(frac*pctDone*100);
          const remW    = Math.round(frac*(1-pctDone)*100);
          html += `<td class="bar-cell"><div class="bar-inner" style="justify-content:flex-start;padding:0 1px">` +
            (doneW  ? `<div style="width:${doneW}%;height:60%;background:${ph.color};border-radius:2px 0 0 2px;flex-shrink:0"></div>` : '') +
            (remW   ? `<div style="width:${remW}%;height:60%;background:${ph.color}55;border-radius:${doneW?'0':'2px'} 2px 2px ${doneW?'0':'2px'};flex-shrink:0"></div>` : '') +
            `</div></td>`;
        } else {
          html += `<td class="bar-cell"><div class="bar-inner"></div></td>`;
        }
      });
      html += `</tr>`;
    });

    // Add subtask button row
    html += `<tr class="add-sub-row${ph.open?'':' hidden'}" data-phase="${ph.id}">
      <td class="add-btn-cell" colspan="${6+weeks.length}">
        <button class="add-inline-btn" onclick="openAddSub('${ph.id}')">＋ Add subtask</button>
        <button class="add-inline-btn" style="margin-left:8px" onclick="openEditPhase('${ph.id}')">✎ Edit phase</button>
      </td>
    </tr>`;

    html += `<tr class="spacer-row"><td colspan="${6+weeks.length}"></td></tr>`;
  });

  body.innerHTML = html;
}

function togglePhase(phId){
  const ph = state.phases.find(p=>p.id===phId);
  if(!ph) return;
  ph.open = !ph.open;
  // Toggle visibility of sub rows without full re-render
  document.querySelectorAll(`[data-phase="${phId}"]`).forEach(el=>{
    el.classList.toggle('hidden', !ph.open);
  });
  const chevrons = document.querySelectorAll(`.phase-row`);
  renderGantt(); // simple re-render
  save();
}

let modalCallback = null;

function openModal(title, bodyHtml, onSave){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  modalCallback = onSave;
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(()=>{ const f=document.querySelector('#modal-body input,#modal-body select'); if(f)f.focus(); },100);
}
function closeModal(){ document.getElementById('modal-bg').classList.remove('open'); modalCallback=null; }
function saveModal(){ if(modalCallback) modalCallback(); }

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA') saveModal(); });

// ── Add/Edit Phase ──
function openAddPhase(){
  const colorIdx = state.phases.length % PHASE_COLORS.length;
  openModal('Add Phase', phaseForm({label:'',color:PHASE_COLORS[colorIdx]}), ()=>{
    const label = document.getElementById('mf-label').value.trim();
    const color = document.getElementById('mf-color').value;
    if(!label) return alert('Please enter a phase name.');
    state.phases.push({ id:uid(), label, color, open:true, subtasks:[] });
    save(); renderAll(); closeModal();
  });
}

function openEditPhase(phId){
  const ph = state.phases.find(p=>p.id===phId);
  openModal('Edit Phase', phaseForm(ph), ()=>{
    ph.label = document.getElementById('mf-label').value.trim();
    ph.color = document.getElementById('mf-color').value;
    if(!ph.label) return alert('Please enter a phase name.');
    save(); renderAll(); closeModal();
  });
  // Add delete button
  document.getElementById('modal-save-btn').insertAdjacentHTML('beforebegin',
    `<button class="btn btn-danger btn-sm" onclick="deletePhase('${phId}')">Delete Phase</button>`);
}

function phaseForm(ph){
  return `<div class="form-row"><label>Phase Name</label><input id="mf-label" value="${esc(ph.label||'')}"></div>
  <div class="form-row"><label>Color</label><div style="display:flex;gap:8px;flex-wrap:wrap">
  ${PHASE_COLORS.map(c=>`<div onclick="document.getElementById('mf-color').value='${c}';document.querySelectorAll('.color-swatch').forEach(s=>s.style.outline='none');this.style.outline='2px solid white'" class="color-swatch" style="width:24px;height:24px;border-radius:50%;background:${c};cursor:pointer;outline:${ph.color===c?'2px solid white':'none'};outline-offset:2px"></div>`).join('')}
  <input id="mf-color" type="hidden" value="${ph.color||PHASE_COLORS[0]}"></div></div>`;
}

function deletePhase(phId){
  if(!confirm('Delete this phase and all its subtasks?')) return;
  state.phases = state.phases.filter(p=>p.id!==phId);
  save(); renderAll(); closeModal();
}

// ── Add/Edit Subtask ──
function openAddSub(phId){
  const ph = state.phases.find(p=>p.id===phId);
  openModal(`Add Subtask — ${ph.label}`, subForm({label:'',owner:'',startDate:state.projectStart,durationDays:7,pct:0,costs:[]}, ph.color), ()=>{
    const sub = readSubForm();
    if(!sub.label) return alert('Please enter a subtask name.');
    sub.id = uid();
    ph.subtasks.push(sub);
    ph.open = true;
    save(); renderAll(); closeModal();
  });
}

function openEditSub(phId, subId){
  const ph = state.phases.find(p=>p.id===phId);
  const sub = ph.subtasks.find(s=>s.id===subId);
  openModal(`Edit Subtask`, subForm(sub, ph.color), ()=>{
    const updated = readSubForm();
    Object.assign(sub, updated);
    save(); renderAll(); closeModal();
  });
  document.getElementById('modal-save-btn').insertAdjacentHTML('beforebegin',
    `<button class="btn btn-danger btn-sm" onclick="deleteSub('${phId}','${subId}')">Delete</button>`);
}

function subForm(sub, color){
  const costsHtml = (sub.costs||[]).map((c,i)=>`
    <div class="cost-item-row" id="ci-${i}">
      <input placeholder="Description" value="${esc(c.desc||'')}" oninput="updateCostItem(${i},'desc',this.value)">
      <input placeholder="$0" value="${c.amt||''}" type="number" min="0" oninput="updateCostItem(${i},'amt',this.value)" style="text-align:right">
      <button class="del-cost-btn" onclick="removeCostItem(${i})">×</button>
    </div>`).join('');

  return `
  <div class="form-row"><label>Subtask Name</label><input id="mf-sub-label" value="${esc(sub.label||'')}"></div>
  <div class="form-2col">
    <div class="form-row"><label>Task Owner</label><input id="mf-owner" value="${esc(sub.owner||'')}"></div>
    <div class="form-row"><label>% Complete</label><input id="mf-pct" type="number" min="0" max="100" value="${sub.pct||0}"></div>
  </div>
  <div class="form-2col">
    <div class="form-row"><label>Start Date</label><input id="mf-start" type="date" value="${sub.startDate||''}"></div>
    <div class="form-row"><label>Duration (days)</label><input id="mf-days" type="number" min="1" value="${sub.durationDays||7}"></div>
  </div>
  <div class="form-row">
    <label>Cost Items</label>
    <div class="cost-items-list" id="cost-items-list">${costsHtml||'<div style="padding:10px;color:var(--text3);font-size:12px">No cost items yet.</div>'}</div>
    <button class="add-cost-item-btn" onclick="addCostItem()">＋ Add cost item</button>
  </div>`;
}

// Temp costs array for modal editing
let tempCosts = [];

function openEditSub_withCosts(phId, subId){
  // wrapped above
}

// We need to initialize tempCosts when opening sub modal
const _origOpenAddSub = openAddSub;
const _origOpenEditSub = openEditSub;

window.openAddSub = function(phId){
  const ph = state.phases.find(p=>p.id===phId);
  tempCosts = [];
  openModal(`Add Subtask — ${esc(ph.label)}`, subForm({label:'',owner:'',startDate:state.projectStart,durationDays:7,pct:0,costs:[]}, ph.color), ()=>{
    const sub = readSubForm();
    if(!sub.label) return alert('Please enter a subtask name.');
    sub.id = uid();
    ph.subtasks.push(sub);
    ph.open = true;
    save(); renderAll(); closeModal();
  });
};

window.openEditSub = function(phId, subId){
  const ph = state.phases.find(p=>p.id===phId);
  const sub = ph.subtasks.find(s=>s.id===subId);
  tempCosts = JSON.parse(JSON.stringify(sub.costs||[]));
  openModal('Edit Subtask', subForm(sub, ph.color), ()=>{
    const updated = readSubForm();
    Object.assign(sub, updated);
    save(); renderAll(); closeModal();
  });
  document.getElementById('modal-save-btn').insertAdjacentHTML('beforebegin',
    `<button class="btn btn-danger btn-sm" onclick="deleteSub('${phId}','${subId}')">Delete</button>`);
};

window.addCostItem = function(){
  tempCosts.push({id:uid(),desc:'',amt:0});
  refreshCostList();
};

window.removeCostItem = function(i){
  tempCosts.splice(i,1);
  refreshCostList();
};

window.updateCostItem = function(i,field,val){
  if(tempCosts[i]) tempCosts[i][field] = field==='amt'?parseFloat(val)||0:val;
};

function refreshCostList(){
  const list = document.getElementById('cost-items-list');
  if(!list) return;
  list.innerHTML = tempCosts.length ? tempCosts.map((c,i)=>`
    <div class="cost-item-row">
      <input placeholder="Description" value="${esc(c.desc||'')}" oninput="updateCostItem(${i},'desc',this.value)">
      <input placeholder="$0" value="${c.amt||''}" type="number" min="0" oninput="updateCostItem(${i},'amt',this.value)" style="text-align:right">
      <button class="del-cost-btn" onclick="removeCostItem(${i})">×</button>
    </div>`).join('') : '<div style="padding:10px;color:var(--text3);font-size:12px">No cost items yet.</div>';
}

function readSubForm(){
  return {
    label:       document.getElementById('mf-sub-label').value.trim(),
    owner:       document.getElementById('mf-owner').value.trim(),
    startDate:   document.getElementById('mf-start').value,
    durationDays:parseInt(document.getElementById('mf-days').value)||7,
    pct:         Math.min(100,Math.max(0,parseInt(document.getElementById('mf-pct').value)||0)),
    costs:       tempCosts.filter(c=>c.desc||c.amt),
  };
}

function deleteSub(phId, subId){
  if(!confirm('Delete this subtask?')) return;
  const ph = state.phases.find(p=>p.id===phId);
  ph.subtasks = ph.subtasks.filter(s=>s.id!==subId);
  save(); renderAll(); closeModal();
}

// ══════════════════════════════════════════
// TOOLBAR / NAV
// ══════════════════════════════════════════
function switchView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(el=>el.classList.remove('active'));
  document.getElementById(v+'-view').classList.add('active');
  document.querySelector(`.nav-tab[onclick="switchView('${v}')"]`).classList.add('active');
  if(v==='cost') renderCost();
}

function onProjectStartChange(){
  state.projectStart = document.getElementById('project-start').value;
  save(); renderGantt(); renderStats();
}
function onProjectEndChange(){
  state.projectEnd = document.getElementById('project-end').value;
  save(); renderGantt(); renderStats();
}

// ══════════════════════════════════════════
// EXPORT / IMPORT
// ══════════════════════════════════════════
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'remodel-plan.json';
  a.click();
}

function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      state = JSON.parse(ev.target.result);
      document.getElementById('project-start').value = state.projectStart;
      document.getElementById('project-end').value = state.projectEnd;
      save(); renderAll();
    } catch(err){ alert('Invalid file.'); }
  };
  reader.readAsText(file);
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
